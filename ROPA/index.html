<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armario Virtual</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin: 20px; background-color: #f4f4f9; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .section { margin-bottom: 20px; }
        .gallery { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 10px; }
        .gallery img { width: 100px; height: 100px; object-fit: contain; border: 1px solid #ddd; border-radius: 5px; background-color: #fff; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
        button:disabled { background-color: #ccc; }
        #status { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mi Armario Virtual</h1>

        <div class="section">
            <h3>Añadir Prenda</h3>
            <input type="file" id="imageInput" accept="image/*" capture="environment">
            <br><br>
            <select id="typeSelect">
                <option value="camiseta">Camiseta / Superior</option>
                <option value="pantalon">Pantalón / Inferior</option>
            </select>
            <br><br>
            <button id="uploadBtn" onclick="uploadImage()">Subir y Procesar</button>
            <p id="status"></p>
        </div>

        <hr>

        <div class="section">
            <h3>Parte Superior</h3>
            <div id="topsGallery" class="gallery"></div>
        </div>

        <div class="section">
            <h3>Parte Inferior</h3>
            <div id="bottomsGallery" class="gallery"></div>
        </div>
    </div>

    <script>
        // Redimensiona la foto en el móvil para evitar exceder límites de memoria y timeout
        async function comprimirImagen(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 1024;
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;

                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                        canvas.toBlob((blob) => {
                            resolve(new File([blob], file.name, { type: 'image/jpeg' }));
                        }, 'image/jpeg', 0.85);
                    };
                };
            });
        }

        async function uploadImage() {
            const input = document.getElementById('imageInput');
            const typeSelect = document.getElementById('typeSelect');
            const status = document.getElementById('status');
            const btn = document.getElementById('uploadBtn');

            if (!input.files || !input.files[0]) {
                alert('Por favor selecciona una imagen primero.');
                return;
            }

            btn.disabled = true;
            status.style.color = 'black';
            status.innerText = 'Procesando imagen (quitando fondo)...';

            try {
                const rawFile = input.files[0];
                const compressedFile = await comprimirImagen(rawFile);

                const formData = new FormData();
                formData.append('file', compressedFile);
                formData.append('type', typeSelect.value);

                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    status.style.color = 'green';
                    status.innerText = '¡Prenda guardada correctamente!';
                    loadGarments();
                } else {
                    status.style.color = 'red';
                    status.innerText = 'Error: ' + (result.error || 'No se pudo procesar la imagen');
                }
            } catch (err) {
                status.style.color = 'red';
                status.innerText = 'Error de conexión al subir la imagen.';
            } finally {
                btn.disabled = false;
            }
        }

        async function loadGarments() {
            try {
                const res = await fetch('/api/garments');
                const data = await res.json();

                const topsGallery = document.getElementById('topsGallery');
                const bottomsGallery = document.getElementById('bottomsGallery');

                topsGallery.innerHTML = '';
                bottomsGallery.innerHTML = '';

                data.tops.forEach(src => {
                    const img = document.createElement('img');
                    img.src = src + '?t=' + new Date().getTime();
                    topsGallery.appendChild(img);
                });

                data.bottoms.forEach(src => {
                    const img = document.createElement('img');
                    img.src = src + '?t=' + new Date().getTime();
                    bottomsGallery.appendChild(img);
                });
            } catch (err) {
                console.error('Error cargando imágenes:', err);
            }
        }

        window.onload = loadGarments;
    </script>
</body>
</html>
        updateTop(); updateBottom();
    </script>
</body>
</html>
